<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1115;
    --surface: #171A20;
    --surface-2: #1E222B;
    --border: #2A2F3A;
    --border-soft: #23272F;
    --text: #ECE9E2;
    --text-dim: #9AA0AC;
    --text-faint: #5E6472;
    --accent: #C9A660;
    --accent-soft: rgba(201,166,96,0.14);
    --good: #6FCF97;
    --good-soft: rgba(111,207,151,0.14);
    --warn: #E0A458;
    --warn-soft: rgba(224,164,88,0.14);
    --danger: #C4544A;
    --danger-soft: rgba(196,84,74,0.14);
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .serif{ font-family: "Fraunces", Georgia, serif; }
  .mono{ font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

  .app{
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* header */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 24px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .wordmark{
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .wordmark span{ color: var(--accent); }
  .summary{
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 4px;
  }
  .summary strong{ color: var(--text); font-weight: 500; }

  button{
    font-family: inherit;
    cursor: pointer;
  }
  .btn{
    background: var(--accent);
    color: #171307;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    transition: opacity .15s ease;
  }
  .btn:hover{ opacity: .88; }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
  }
  .btn-ghost:hover{ color: var(--text); border-color: var(--text-faint); }

  /* toolbar */
  .toolbar{
    display:flex;
    gap: 10px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .search{
    flex: 1;
    min-width: 180px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
  }
  .search::placeholder{ color: var(--text-faint); }
  .search:focus{ outline: none; border-color: var(--text-faint); }
  select.sort{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    padding: 10px 12px;
    font-size: 13px;
  }

  /* grid */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 18px;
    position: relative;
    transition: border-color .15s ease;
  }
  .card:hover{ border-color: var(--border); }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .dot{
    width: 8px; height: 8px; border-radius: 50%;
    display:inline-block;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .dot.good{ background: var(--good); }
  .dot.warn{ background: var(--warn); }
  .dot.unknown{ background: var(--text-faint); }

  .alias{
    font-size: 16px;
    font-weight: 600;
    display:flex;
    align-items:center;
  }
  .plan-badge{
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .email{
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 10px;
    word-break: break-all;
  }

  .status-line{
    margin-top: 14px;
    padding: 9px 12px;
    border-radius: 7px;
    font-size: 13px;
  }
  .status-line.good{ background: var(--good-soft); color: var(--good); }
  .status-line.warn{ background: var(--warn-soft); color: var(--warn); }
  .status-line.unknown{ background: var(--surface-2); color: var(--text-faint); }

  .divider{
    height: 1px;
    background: var(--border-soft);
    margin: 14px 0 10px;
  }

  .proj-label{
    font-size: 11.5px;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .proj-item{
    font-size: 13px;
    color: var(--text);
    padding: 5px 0;
    border-bottom: 1px dashed var(--border-soft);
  }
  .proj-item:last-child{ border-bottom: none; }
  .proj-item .proj-detail{
    color: var(--text-dim);
    font-size: 12px;
    display:block;
    margin-top: 1px;
  }
  .proj-empty{
    font-size: 12.5px;
    color: var(--text-faint);
    font-style: italic;
  }

  .card-actions{
    position:absolute;
    top: 14px; right: 14px;
    display:flex; gap: 6px;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .card:hover .card-actions{ opacity: 1; }
  .icon-btn{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 26px; height: 26px;
    border-radius: 6px;
    font-size: 13px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color: var(--text); }

  .empty-state{
    text-align:center;
    padding: 90px 20px;
    color: var(--text-dim);
  }
  .empty-state .serif{ font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .empty-state p{ font-size: 14px; margin-bottom: 22px; }

  /* modal */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(6,7,9,0.6);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .modal{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 26px;
  }
  .modal h2{
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 21px;
    margin: 0 0 18px;
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input, .field textarea, .field select{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 11px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .field textarea{ resize: vertical; min-height: 56px; }
  .hint{ font-size: 11.5px; color: var(--text-faint); margin-top: 5px; }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline: none; border-color: var(--accent);
  }
  .field-row{ display:flex; gap: 10px; }
  .field-row .field{ flex: 1; }

  .proj-manage-item{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 7px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .proj-manage-item .txt{ flex: 1; }
  .proj-manage-item .txt small{ display:block; color: var(--text-dim); font-size: 11.5px; }
  .proj-add-row{
    display:flex; gap: 6px; margin-top: 8px;
  }
  .proj-add-row input{
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    color: var(--text);
    font-size: 13px;
  }

  .modal-actions{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 22px;
    gap: 10px;
  }

  @media (max-width: 560px){
    .app{ padding: 26px 16px 60px; }
    .wordmark{ font-size: 28px; }
    header{ align-items: flex-start; }
  }

  /* login */
  .login-screen{
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 18px;
    padding: 20px;
    text-align:center;
  }
  .login-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 30px;
    max-width: 360px;
    width: 100%;
  }
  .login-card .wordmark{ font-size: 28px; margin-bottom: 6px; }
  .login-card p{ color: var(--text-dim); font-size: 13.5px; margin: 0 0 22px; }
  .btn-google{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    width: 100%;
    background: var(--text);
    color: #171307;
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-google:hover{ opacity: .9; }
  .login-error{
    margin-top: 16px;
    font-size: 13px;
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 7px;
    padding: 9px 12px;
    display:none;
  }
  .login-error.show{ display:block; }
  .btn-logout{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 12.5px;
  }
  .btn-logout:hover{ color: var(--text); border-color: var(--text-faint); }
  .hidden{ display:none !important; }

  .tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--border-soft)}
  .tab{background:none;border:none;color:var(--text-dim);padding:10px 16px;font-size:14px;border-bottom:2px solid transparent}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .alert{background:var(--warn-soft);border:1px solid var(--warn);color:var(--text);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13.5px;line-height:1.6}
  .alert b{display:block;color:var(--warn);margin-bottom:4px}
  .svc{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--border-soft);font-size:13px}
  .svc:last-child{border-bottom:none}
  .svc-name{flex:1}.svc-name small{color:var(--text-faint);font-size:11px}
  .svc-st{font-size:11.5px;padding:2px 8px;border-radius:20px}
  .svc-st.good{background:var(--good-soft);color:var(--good)}
  .svc-st.warn{background:var(--warn-soft);color:var(--warn)}
  .svc-st.unknown{background:var(--surface-2);color:var(--text-faint)}
  .svc-edit{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .svc-edit input,.svc-edit select{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:7px 8px;color:var(--text);font-size:13px;min-width:0}
  .svc-edit input:first-child{flex:1 1 110px}.svc-edit input:nth-child(2){flex:1 1 90px}
  .chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);border-radius:20px;padding:4px 10px;font-size:12px;margin:6px 6px 0 0}
  .chip:hover,.chip.on{color:var(--text);border-color:var(--accent)}
  .chip.on{background:var(--accent-soft)}
  .week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .bar{height:6px;background:var(--surface-2);border-radius:4px;margin:10px 0 12px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar.full i{background:var(--good)}
  .post{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--border-soft);font-size:13px}
  .post:last-of-type{border-bottom:none}
  .post.done .post-main div{text-decoration:line-through;color:var(--text-faint)}
  .post-main{flex:1;min-width:0}.post-main small{color:var(--text-dim);font-size:11.5px}
  .post select{padding:5px 6px;font-size:12px}
  .card .btn-ghost.sm{padding:6px 10px;font-size:12.5px;margin-top:10px}
  .settings{margin-top:18px}
  .settings .field-row{align-items:flex-end}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="wordmark serif">Con<span>sola</span></div>
    <p>Acceso restringido</p>
    <button class="btn-google" id="btnGoogleLogin">Iniciar sesión con Google</button>
    <div class="login-error" id="loginError">Esta cuenta no tiene acceso a la consola.</div>
  </div>
</div>

<div class="app hidden" id="appRoot">
  <header>
    <div>
      <div class="wordmark serif">Con<span>sola</span></div>
      <div class="summary" id="summary"></div>
      <div class="summary" id="syncStatus" style="margin-top:2px;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn" id="btnAdd">Agregar cuenta</button>
      <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <div class="tabs"><button class="tab active" data-tab="cuentas">Correos y cuentas</button><button class="tab" data-tab="redes">Redes sociales</button></div>
  <div id="alerts"></div>
  <div id="viewCuentas"><div class="toolbar">
    <input class="search" id="search" type="text" placeholder="Buscar por alias, correo, servicio o proyecto…">
    <select class="sort" id="svcFilter"></select>
    <select class="sort" id="sort">
      <option value="reset">Ordenar: disponibles primero</option>
      <option value="alias">Ordenar: alias</option>
      <option value="recent">Ordenar: agregadas recientemente</option>
    </select>
  </div>

  <div id="content"></div></div>
  <div id="viewRedes" class="hidden"></div>
</div>

<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCbFQrg6ABqCJzclSwHcMoiEs430rrLi5Y",
  authDomain: "admin-f9ec7.firebaseapp.com",
  projectId: "admin-f9ec7",
  storageBucket: "admin-f9ec7.firebasestorage.app",
  messagingSenderId: "808772474823",
  appId: "1:808772474823:web:c7b3157e18079ddac22be2"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const DOC_ID = 'main'; // documento fijo: solo hay un usuario autorizado, ya no depende del UID de sesión

let accounts = [];
let editingId = null;

const PLANS = ['Free', 'Pro', 'Max 5x', 'Max 20x', 'Team', 'API'];

function uid(){
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
}

function setSyncStatus(text){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = text;
}

async function loadAccounts(){
  setSyncStatus('Sincronizando…');
  try{
    const mainRef = doc(db, 'consola', DOC_ID);
    let snap = await getDoc(mainRef);

    if(snap.exists()){
      accounts = Array.isArray(snap.data().accounts) ? snap.data().accounts : [];
      Object.assign(social, snap.data().social || {});
    } else {
      // no existe el documento fijo todavía: buscamos datos viejos guardados
      // con la sesión anónima anterior y los migramos una sola vez.
      let migrated = null;
      const allDocs = await getDocs(collection(db, 'consola'));
      allDocs.forEach(d => {
        if(!migrated && Array.isArray(d.data().accounts) && d.data().accounts.length){
          migrated = d.data().accounts;
        }
      });
      if(migrated){
        await setDoc(mainRef, { accounts: migrated }, { merge: true });
        accounts = migrated;
      } else {
        accounts = [];
      }
    }
    setSyncStatus('');
  }catch(e){
    console.error(e);
    accounts = [];
    setSyncStatus('No se pudo conectar con Firebase');
  }
  accounts.forEach(migrateAcc);
  renderAll();
}

async function saveAccounts(){
  setSyncStatus('Guardando…');
  try{
    await setDoc(doc(db, 'consola', DOC_ID), { accounts, social }, { merge: true });
    setSyncStatus('');
  }catch(e){
    console.error(e);
    setSyncStatus('No se pudo guardar');
  }
}

function tokenStatus(resetAt){
  if(!resetAt) return { label: 'Sin dato de reinicio', cls: 'unknown', dot: 'unknown' };
  const now = Date.now();
  const reset = new Date(resetAt).getTime();
  if(isNaN(reset)) return { label: 'Sin dato de reinicio', cls: 'unknown', dot: 'unknown' };
  if(reset <= now) return { label: 'Disponible ahora', cls: 'good', dot: 'good' };
  const diffMs = reset - now;
  const mins = Math.round(diffMs / 60000);
  const days = Math.floor(mins / 1440);
  const hours = Math.floor((mins % 1440) / 60);
  const rem = mins % 60;
  let txt;
  if(days > 0) txt = `${days}d ${hours}h`;
  else if(hours > 0) txt = `${hours}h ${rem}m`;
  else txt = `${rem}m`;
  return { label: `Vuelve en ${txt}`, cls: 'warn', dot: 'warn' };
}

function fmtDateShort(resetAt){
  if(!resetAt) return '';
  const d = new Date(resetAt);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

function escapeHtml(str){
  if(!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML.replace(/"/g,"&quot;");
}

const SERVICES=['Claude','ChatGPT','Canva','Gemini','CapCut','Midjourney'];
const STATES={disponible:'Disponible',en_uso:'En uso',sin_acceso:'Sin acceso'};
let draftServices=[];

function migrateAcc(a){
  if(!Array.isArray(a.services)) a.services=[{name:'Claude',plan:a.plan||'',state:'disponible',resetAt:a.resetAt||''}];
}
function svcStatus(s){
  const t=tokenStatus(s.resetAt);
  if(s.resetAt && t.cls==='warn') return t;
  if(s.state==='en_uso') return {label:'En uso',cls:'warn'};
  if(s.state==='sin_acceso') return {label:'Sin acceso',cls:'unknown'};
  return {label:'Disponible',cls:'good'};
}
function renderAll(){ render(); renderSocial(); renderAlerts(); }

function render(){
  const sf=document.getElementById('svcFilter');
  const names=[...new Set(accounts.flatMap(a=>(a.services||[]).map(s=>s.name)))].sort();
  const cur=sf.value;
  sf.innerHTML='<option value="">Todos los servicios</option>'+names.map(n=>`<option ${n===cur?'selected':''}>${escapeHtml(n)}</option>`).join('');
  const svc=sf.value;
  const total=accounts.length;
  const pool=svc?accounts.filter(a=>(a.services||[]).some(s=>s.name===svc)):accounts;
  const free=pool.filter(a=>(a.services||[]).some(s=>(!svc||s.name===svc)&&svcStatus(s).cls==='good')).length;
  document.getElementById('summary').innerHTML=total===0?'':svc
    ?`<strong>${free}</strong> de <strong>${pool.length}</strong> correos disponibles para ${escapeHtml(svc)}`
    :`<strong>${total}</strong> correo${total===1?'':'s'} · <strong>${free}</strong> con algún servicio disponible`;

  const search=(document.getElementById('search').value||'').toLowerCase().trim();
  const sortBy=document.getElementById('sort').value;
  const rel=a=>(a.services||[]).filter(s=>!svc||s.name===svc);
  const key=a=>rel(a).some(s=>svcStatus(s).cls==='good')?0:Math.min(Infinity,...rel(a).map(s=>s.resetAt?new Date(s.resetAt).getTime():Infinity));
  let list=pool.filter(a=>{
    if(!search) return true;
    const hay=[a.alias,a.email,a.notes,...(a.services||[]).map(s=>s.name+' '+(s.plan||'')),...(a.projects||[]).map(p=>p.name+' '+p.detail)].join(' ').toLowerCase();
    return hay.includes(search);
  });
  list=list.slice().sort((a,b)=>{
    if(sortBy==='alias') return (a.alias||'').localeCompare(b.alias||'');
    if(sortBy==='recent') return (b._created||0)-(a._created||0);
    const ka=key(a),kb=key(b); return ka<kb?-1:ka>kb?1:0;
  });
  const content=document.getElementById('content');
  if(accounts.length===0){
    content.innerHTML=`<div class="empty-state"><div class="serif">Todavía no hay correos cargados</div><p>Agregá tu primer correo y marcá para qué servicios lo usás (Claude, ChatGPT, Canva...).</p><button class="btn" onclick="openModal()">Agregar cuenta</button></div>`;
    return;
  }
  if(list.length===0){ content.innerHTML=`<div class="empty-state"><p>Ningún correo coincide con la búsqueda.</p></div>`; return; }
  content.innerHTML=`<div class="grid">${list.map(cardHtml).join('')}</div>`;
}

function cardHtml(a){
  const projects=a.projects||[], preview=projects.slice(0,3), svcs=a.services||[];
  const svcHtml=svcs.length?svcs.map(s=>{const st=svcStatus(s);return `<div class="svc"><span class="dot ${st.cls}"></span><span class="svc-name">${escapeHtml(s.name)}${s.plan?` <small>${escapeHtml(s.plan)}</small>`:''}</span><span class="svc-st ${st.cls} mono">${st.label}${s.resetAt&&st.cls==='warn'?' · '+fmtDateShort(s.resetAt):''}</span></div>`;}).join(''):`<div class="proj-empty">Sin servicios marcados</div>`;
  const projHtml=preview.length
    ?preview.map(p=>`<div class="proj-item">${escapeHtml(p.name)}${p.detail?`<span class="proj-detail">${escapeHtml(p.detail)}</span>`:''}</div>`).join('')+(projects.length>3?`<div class="proj-detail" style="margin-top:4px;">+${projects.length-3} más</div>`:'')
    :`<div class="proj-empty">Sin proyectos registrados</div>`;
  return `
    <div class="card">
      <div class="card-actions">
        <button class="icon-btn" title="Editar" onclick="openModal('${a.id}')">✎</button>
        <button class="icon-btn" title="Eliminar" onclick="deleteAccount('${a.id}')">✕</button>
      </div>
      <div class="alias">${escapeHtml(a.alias||'Sin alias')}</div>
      <div class="email mono">${escapeHtml(a.email||'sin correo')}</div>
      <div class="divider"></div>
      <div class="proj-label">Servicios</div>
      ${svcHtml}
      <div class="divider"></div>
      <div class="proj-label">Proyectos trabajados</div>
      ${projHtml}
    </div>`;
}

function deleteAccount(id){
  const acc = accounts.find(a => a.id === id);
  if(!acc) return;
  if(!confirm(`Eliminar la cuenta "${acc.alias || acc.email}"?`)) return;
  accounts = accounts.filter(a => a.id !== id);
  saveAccounts();
  render();
}

// ---------- modal ----------

let draftProjects = [];

function openModal(id){
  editingId=id||null;
  const acc=id?accounts.find(a=>a.id===id):null;
  draftProjects=acc?JSON.parse(JSON.stringify(acc.projects||[])):[];
  draftServices=acc?(acc.services||[]).map(s=>({...s,time:timeOnly(s.resetAt)})):[{name:'Claude',plan:'',state:'disponible',resetAt:'',time:''}];
  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="overlay"><div class="modal">
      <h2 class="serif">${acc?'Editar cuenta':'Nueva cuenta'}</h2>
      <div class="field"><label for="fAlias">Alias</label><input id="fAlias" type="text" placeholder="Ej: Cuenta principal" value="${escapeHtml(acc?.alias)}"></div>
      <div class="field"><label for="fEmail">Correo</label><input id="fEmail" type="email" placeholder="correo@ejemplo.com" value="${escapeHtml(acc?.email)}"></div>
      <div class="field">
        <label>Servicios donde uso este correo</label>
        <div id="svcList"></div>
        <datalist id="svcNames">${SERVICES.map(n=>`<option value="${n}">`).join('')}</datalist>
        <div>${SERVICES.map(n=>`<button type="button" class="chip" onclick="addSvc('${n}')">+ ${n}</button>`).join('')}<button type="button" class="chip" onclick="addSvc('')">+ Otro</button></div>
        <div class="hint">Estado: Disponible, En uso o Sin acceso. La hora es opcional: cuándo vuelve a estar libre (límite de tokens, etc.).</div>
      </div>
      <div class="field"><label for="fNotes">Notas</label><textarea id="fNotes" placeholder="Contraseña, apuntes, límites, etc.">${escapeHtml(acc?.notes)}</textarea></div>
      <div class="field">
        <label>Proyectos trabajados en esta cuenta</label>
        <div id="projList"></div>
        <div class="proj-add-row">
          <input id="newProjName" type="text" placeholder="Nombre del proyecto">
          <input id="newProjDetail" type="text" placeholder="Detalle (opcional)">
          <button class="icon-btn" style="width:34px;" onclick="addDraftProject()">+</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn" onclick="saveAccountFromModal()">${acc?'Guardar cambios':'Agregar cuenta'}</button>
      </div>
    </div></div>`;
  renderDraftServices(); renderDraftProjects();
  document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
}
function renderDraftServices(){
  const el=document.getElementById('svcList'); if(!el) return;
  el.innerHTML=draftServices.length?draftServices.map((s,i)=>`
    <div class="svc-edit">
      <input list="svcNames" placeholder="Servicio" value="${escapeHtml(s.name)}" oninput="updSvc(${i},'name',this.value)">
      <input placeholder="Plan (opcional)" value="${escapeHtml(s.plan)}" oninput="updSvc(${i},'plan',this.value)">
      <select onchange="updSvc(${i},'state',this.value)">${Object.entries(STATES).map(([k,v])=>`<option value="${k}" ${s.state===k?'selected':''}>${v}</option>`).join('')}</select>
      <input type="time" title="Hora en que vuelve" value="${s.time||''}" oninput="updSvc(${i},'time',this.value)">
      <button type="button" class="icon-btn" style="height:auto;" onclick="rmSvc(${i})">✕</button>
    </div>`).join(''):`<div class="proj-empty">Todavía no marcaste servicios.</div>`;
}
function addSvc(name){ draftServices.push({name,plan:'',state:'disponible',resetAt:'',time:''}); renderDraftServices(); }
function updSvc(i,k,v){ draftServices[i][k]=v; }
function rmSvc(i){ draftServices.splice(i,1); renderDraftServices(); }

function timeOnly(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// A partir de una hora "HH:MM", calcula la próxima ocurrencia de esa hora:
// si todavía no pasó hoy, queda para hoy; si ya pasó, queda para mañana.
function nextOccurrenceOf(timeStr){
  const [hh, mm] = timeStr.split(':').map(Number);
  const now = new Date();
  const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
  if(candidate.getTime() <= now.getTime()){
    candidate.setDate(candidate.getDate() + 1);
  }
  return candidate.toISOString();
}

function renderDraftProjects(){
  const el = document.getElementById('projList');
  if(!el) return;
  if(draftProjects.length === 0){
    el.innerHTML = `<div class="proj-empty">Todavía no agregaste proyectos.</div>`;
    return;
  }
  el.innerHTML = draftProjects.map((p, i) => `
    <div class="proj-manage-item">
      <div class="txt">${escapeHtml(p.name)}${p.detail ? `<small>${escapeHtml(p.detail)}</small>` : ''}</div>
      <button class="icon-btn" onclick="removeDraftProject(${i})">✕</button>
    </div>
  `).join('');
}

function addDraftProject(){
  const nameEl = document.getElementById('newProjName');
  const detailEl = document.getElementById('newProjDetail');
  const name = nameEl.value.trim();
  if(!name) return;
  draftProjects.push({ id: uid(), name, detail: detailEl.value.trim() });
  nameEl.value = '';
  detailEl.value = '';
  renderDraftProjects();
  nameEl.focus();
}

function removeDraftProject(i){
  draftProjects.splice(i, 1);
  renderDraftProjects();
}

function saveAccountFromModal(){
  const alias=document.getElementById('fAlias').value.trim();
  const email=document.getElementById('fEmail').value.trim();
  const notes=document.getElementById('fNotes').value.trim();
  if(!alias&&!email){ alert('Ingresá al menos un alias o un correo.'); return; }
  const services=draftServices.filter(s=>s.name.trim()).map(s=>({
    name:s.name.trim(), plan:(s.plan||'').trim(), state:s.state||'disponible',
    resetAt:s.time?(s.time===timeOnly(s.resetAt)?s.resetAt:nextOccurrenceOf(s.time)):''
  }));
  if(editingId){
    const acc=accounts.find(a=>a.id===editingId);
    Object.assign(acc,{alias,email,notes,services,projects:draftProjects});
    delete acc.plan; delete acc.resetAt;
  } else {
    accounts.push({id:uid(),alias,email,notes,services,projects:draftProjects,_created:Date.now()});
  }
  saveAccounts(); closeModal(); render();
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  editingId = null;
  draftProjects = [];
}

// exponer al scope global: se llaman desde atributos onclick generados dinámicamente
window.openModal = openModal;
window.closeModal = closeModal;
window.deleteAccount = deleteAccount;
window.addDraftProject = addDraftProject;
window.removeDraftProject = removeDraftProject;
window.saveAccountFromModal = saveAccountFromModal;

document.getElementById('btnAdd').addEventListener('click', () => tab === 'redes' ? openPost() : openModal());
document.getElementById('svcFilter').addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);
document.getElementById('sort').addEventListener('change', render);

setInterval(() => { if(!document.activeElement || !document.activeElement.matches('input,select,textarea')) renderAll(); checkNotify(); }, 30000);

// ---------- login ----------

const ALLOWED_EMAIL = 'saanty086@gmail.com';
const googleProvider = new GoogleAuthProvider();

const loginScreen = document.getElementById('loginScreen');
const appRoot = document.getElementById('appRoot');
const loginError = document.getElementById('loginError');

document.getElementById('btnGoogleLogin').addEventListener('click', () => {
  loginError.classList.remove('show');
  signInWithPopup(auth, googleProvider).catch((e) => {
    console.error(e);
    loginError.textContent = 'No se pudo iniciar sesión. Intentá de nuevo.';
    loginError.classList.add('show');
  });
});

document.getElementById('btnLogout').addEventListener('click', () => {
  signOut(auth);
});

onAuthStateChanged(auth, (user) => {
  if(user && user.email === ALLOWED_EMAIL){
    loginScreen.classList.add('hidden');
    appRoot.classList.remove('hidden');
    loginError.classList.remove('show');
    loadAccounts();
  } else if(user){
    // logueado pero no autorizado
    signOut(auth);
    loginScreen.classList.remove('hidden');
    appRoot.classList.add('hidden');
    loginError.textContent = 'Esta cuenta no tiene acceso a la consola.';
    loginError.classList.add('show');
  } else {
    loginScreen.classList.remove('hidden');
    appRoot.classList.add('hidden');
  }
});
</script>
